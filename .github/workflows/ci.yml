# 5주차 CI: main 에 올리거나 PR 을 열면 테스트를 돌리고, 앱 이미지가 만들어지는지 확인한다.
# 테스트는 Testcontainers 로 PostgreSQL·Redis 를 띄운다(GitHub 의 ubuntu 러너에는 Docker 가 있다).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40   # 로컬 전체 테스트가 10~20분. 멈추면 40분에 끊는다
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4   # Gradle·의존성 캐시

      - name: 테스트
        run: ./gradlew test --no-daemon

      - name: 테스트 리포트 올리기(실패해도)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/tests/test
            build/reports/jacoco/test/html

      - name: jar 만들기
        run: ./gradlew bootJar --no-daemon

      - name: 앱 이미지 빌드 확인
        run: docker build -t mock-invest-league-api:${{ github.sha }} .
