# 로컬 개발용 PostgreSQL (포트 5433: 다른 프로젝트의 5432와 겹치지 않게)
services:
  postgres:
    image: postgres:16-alpine
    container_name: league-postgres
    environment:
      POSTGRES_DB: league
      POSTGRES_USER: league
      POSTGRES_PASSWORD: league
      TZ: Asia/Seoul
    ports:
      - "5433:5432"
    volumes:
      - league-pgdata:/var/lib/postgresql/data

  # 4주차② 캐시 비교용(CACHE_TYPE=redis 로 앱을 띄울 때만 필요). 포트 6380: 다른 프로젝트의 6379와 겹치지 않게
  redis:
    image: redis:7-alpine
    container_name: league-redis
    ports:
      - "6380:6379"

volumes:
  league-pgdata:
