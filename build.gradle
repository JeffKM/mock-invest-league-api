plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.7'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'jacoco'
}

group = 'com.jeffkm'
version = '0.0.1-SNAPSHOT'
description = '모의투자 대회 서버'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    // 6주차③ 지표를 Prometheus 형식(/actuator/prometheus)으로도 내보낸다. Grafana 가 이것을 그래프로 그린다
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.14'

    // 4주차② 캐시: Spring Cache 추상화 + 구현 두 개(Redis, 서버 메모리 Caffeine). 어느 것을 쓸지는 spring.cache.type
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'com.github.ben-manes.caffeine:caffeine'

    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    // 7주차⑤ 시세 푸시 실험: Tomcat(SseEmitter)과 Netty(WebFlux) 비교용. 본 앱은 Tomcat 그대로(테스트 범위만)
    testImplementation 'org.springframework.boot:spring-boot-starter-webflux'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    // 서버(CI, 컨테이너)의 JVM 기본 시간대는 보통 UTC 다. 노트북(Asia/Seoul)에서만 통과하는 시간대 버그를 잡기 위해
    // 테스트는 언제나 UTC 로 돈다(5주차 CI 첫 실행에서 실제로 이 버그가 드러났다. ROADMAP 20단계)
    systemProperty 'user.timezone', 'UTC'
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        html.required = true
        xml.required = true
    }
}
