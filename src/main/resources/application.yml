spring:
  application:
    name: mock-invest-league-api
  datasource:
    url: jdbc:postgresql://localhost:5433/league
    username: league
    password: league   # 로컬 도커 전용 값. 배포 환경은 환경 변수로 덮어쓴다
    hikari:
      data-source-properties:
        # JDBC 배치 INSERT 를 여러 행 INSERT 로 합쳐 보낸다(가격 하루치 1,872행). 효과는 ROADMAP 18단계
        reWriteBatchedInserts: true
  jpa:
    open-in-view: false        # 트랜잭션 밖 지연 로딩 금지 → N+1을 서비스 계층에서 드러나게
    hibernate:
      ddl-auto: validate       # 스키마는 Flyway가 만들고, 엔티티는 검증만
    properties:
      hibernate:
        format_sql: true
        # hibernate.jdbc.time_zone 은 두지 않는다. 두면 LocalTime(장 시간)까지 JVM 시간대와의 차이만큼 밀려 저장된다
        # (JVM 이 UTC 인 CI 에서 09:00 → 18:00, 15:30 → 00:30 으로 저장돼 CHECK 위반). Instant 는 timestamptz 라 원래 시간대와 무관하다
  flyway:
    enabled: true
  # 4주차② 조회 캐시(common/ReadCache). none | caffeine(서버 메모리) | redis. 비교 결과는 ROADMAP 19단계
  # 기본은 caffeine: 키에 버전(틱, 스냅샷 id)이 들어 있어 서버마다 따로 들고 있어도 값이 어긋나지 않는다
  cache:
    type: ${CACHE_TYPE:caffeine}
    cache-names: latestPrices,rankingTop
    caffeine:
      spec: maximumSize=10000,expireAfterWrite=10m,recordStats   # recordStats: 적중률을 /actuator/metrics 의 cache.gets 로 본다
    redis:
      time-to-live: 10m
      key-prefix: "league:v1:"   # 저장 형식(클래스)이 바뀌면 v2 로 올려 예전 값과 섞이지 않게 한다
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      timeout: 500ms             # Redis 가 멈추면 오래 기다리지 말고 DB 로 넘어간다(기본값은 60초)

server:
  port: 8080
  tomcat:
    mbeanregistry:
      enabled: true   # 톰캣 작업 스레드 수(tomcat.threads.busy)를 지표로 낸다. 요청이 스레드를 다 쓰고 있는지 보려고(6주차③)

management:
  health:
    redis:
      enabled: ${REDIS_HEALTH:false}   # 캐시를 Redis 로 쓸 때만 켠다. 안 쓰는데 켜 두면 Redis 가 없다고 DOWN 이 된다
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    distribution:
      # 응답 시간을 구간별 개수(히스토그램)로도 낸다. 그래야 Prometheus 가 p95·p99 를 "시간 구간마다" 계산할 수 있다(6주차③)
      percentiles-histogram:
        http.server.requests: true
        hikaricp.connections.acquire: true
        hikaricp.connections.usage: true

logging:
  # 예외 로그의 스택 줄마다 붙던 "~[spring-core-6.2.12.jar:6.2.12]"(jar 이름·버전)를 뺀다. Spring Boot 기본(%wEx)은 이를 구하려고
  # 줄마다 클래스를 찾는데, 그 과정이 전역 잠금을 잡아 과부하 때 스레드가 줄줄이 멈췄다(5주차② k6, ROADMAP 21단계)
  exception-conversion-word: "%ex"
  level:
    org.hibernate.SQL: debug   # 실행 SQL 확인(N+1 실험용). 부하 테스트 때는 끈다
