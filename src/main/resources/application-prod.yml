# 5주차② 운영(배포) 설정. SPRING_PROFILES_ACTIVE=prod 로 켠다. 값은 모두 환경 변수(deploy/.env)에서 받는다.
# 기본값이 없는 ${...} 는 일부러 그렇게 둔 것이다: 빠뜨리면 앱이 뜨지 않는다(로컬 비밀번호로 운영 DB 에 붙는 사고 방지).
spring:
  datasource:
    url: ${DB_URL}                 # 예: jdbc:postgresql://<RDS 엔드포인트>:5432/league?sslmode=require
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 3000     # DB 연결을 3초 안에 못 얻으면 실패(기본 30초는 요청이 너무 오래 매달린다)
  jpa:
    properties:
      hibernate:
        format_sql: false
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  # 배포로 컨테이너를 내릴 때 새 요청은 막고, 처리 중인 요청(주문 등)은 끝낸 뒤 내려간다(최대 20초)
  shutdown: graceful

league:
  admin:
    token: ${ADMIN_TOKEN}          # /api/admin/** 에 X-Admin-Token 헤더로 보낸다
  order:
    # 6주차③ 사용자별 주문 속도 제한. 사람은 초당 몇 건 이상 누를 수 없다. 넘는 요청은 DB 커넥션을 잡기 전에 429 로 돌려보낸다
    # (한 계좌로 몰린 주문이 잠금 앞에 줄을 서며 커넥션 풀을 다 쥐는 문제, docs/07). 0 이면 끈다
    rate-limit:
      per-second: ${ORDER_RATE_LIMIT:5}
      burst: ${ORDER_RATE_BURST:10}  # 연타·재전송처럼 순간 몰리는 몇 건은 받아 준다
  cache:
    # 6주차⑤ 틱이 바뀌는 순간 같은 키를 동시에 놓친 요청 중 한 명만 DB 를 읽는다(docs/07 8절).
    # 1,000명 규모에서는 틱마다 1~2번 → 1번으로 줄었고 지연 손해는 없었다. 참가자가 늘면 동시에 놓치는 수도 커지므로 켜 둔다
    single-flight: ${LEAGUE_CACHE_SINGLE_FLIGHT:true}

management:
  endpoints:
    web:
      exposure:
        include: ${ACTUATOR_EXPOSE:health,info}   # metrics 는 밖에 열지 않는다. 부하 테스트 때만 잠깐 켠다

logging:
  level:
    org.hibernate.SQL: info        # 기본 설정의 SQL 로그(debug)는 요청마다 디스크 쓰기라 운영에서는 끈다
